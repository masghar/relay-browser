<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; manifest-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#000000">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --ink: #000000;
    --muted: #6b6b6b;
    --line: #d4d4d4;
    --button: #000000;
    --on-button: #ffffff;
    --danger: #c4291c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --ink: #ffffff;
      --muted: #9a9a9a;
      --line: #3a3a3a;
      --button: #ffffff;
      --on-button: #000000;
      --danger: #ff7a6e;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  main { width: min(320px, 100%); }

  h1 {
    margin: 0 0 28px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.01em;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
  }

  .field { position: relative; }
  input {
    width: 100%;
    height: 44px;
    padding: 0 60px 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 16px;
  }
  input:focus { outline: none; border-color: var(--ink); }
  input[aria-invalid="true"] { border-color: var(--danger); }

  .reveal {
    position: absolute;
    top: 6px;
    right: 6px;
    height: 32px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .reveal:hover { color: var(--ink); }

  .hint { min-height: 20px; margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .hint.error { color: var(--danger); }

  button[type="submit"] {
    width: 100%;
    height: 44px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    background: var(--button);
    color: var(--on-button);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: .6; cursor: default; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .note { margin: 32px 0 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main>
    <h1>Sign in</h1>

    <form id="loginForm" novalidate>
      <label for="password">Password</label>
      <div class="field">
        <input type="password" id="password" name="password" autocomplete="off" data-lpignore="true" data-1p-ignore autofocus required spellcheck="false" aria-describedby="hint">
        <button type="button" class="reveal" id="reveal" aria-pressed="false">Show</button>
      </div>
      <p class="hint" id="hint" role="alert" aria-live="polite"></p>
      <button type="submit" id="submit">Sign in</button>
    </form>

    <p class="note">Closing the tab signs you out and deletes everything.</p>
  </main>

  <script>
    (() => {
      const form = document.getElementById('loginForm');
      const input = document.getElementById('password');
      const hint = document.getElementById('hint');
      const submit = document.getElementById('submit');
      const reveal = document.getElementById('reveal');

      function setHint(text, isError) {
        hint.textContent = text;
        hint.classList.toggle('error', !!isError);
        input.setAttribute('aria-invalid', isError ? 'true' : 'false');
      }

      reveal.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        reveal.textContent = show ? 'Hide' : 'Show';
        reveal.setAttribute('aria-pressed', String(show));
        input.focus();
      });

      function capsCheck(e) {
        if (!e.getModifierState || hint.classList.contains('error')) return;
        setHint(e.getModifierState('CapsLock') ? 'Caps Lock is on.' : '', false);
      }
      input.addEventListener('keydown', capsCheck);
      input.addEventListener('keyup', capsCheck);
      input.addEventListener('input', () => {
        if (hint.classList.contains('error')) setHint('', false);
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!input.value) {
          setHint('Enter your password.', true);
          input.focus();
          return;
        }
        submit.disabled = true;
        submit.textContent = 'Signing in…';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          });
          if (res.ok) {
            input.value = '';
            location.replace('/app/');
            return;
          }
          const data = await res.json().catch(() => ({}));
          setHint(data.error || 'Sign-in failed. Try again.', true);
          input.select();
        } catch (err) {
          setHint('Can’t reach the server. Check your connection and try again.', true);
        } finally {
          submit.disabled = false;
          submit.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
